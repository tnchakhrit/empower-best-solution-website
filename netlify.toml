[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[functions."send-reminders"]
  schedule = "0 2 * * *"

[functions."send-admin-digest"]
  schedule = "30 2 * * *"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
